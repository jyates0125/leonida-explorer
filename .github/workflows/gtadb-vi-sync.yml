name: Refresh licensed GTA VI landmarks
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gtadb-vi-sync
  cancel-in-progress: false
jobs:
  refresh-vi:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and refresh source-licensed GTA VI data
        run: python scripts/sync_gtadb_vi.py
      - name: Commit only changed licensed VI snapshots
        run: |
          git config user.name 'Team Jura Atlas updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gtadb-6.json data/gtadb-6-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh CC BY 4.0 GTADB VI landmark snapshot'
            git push
          fi
