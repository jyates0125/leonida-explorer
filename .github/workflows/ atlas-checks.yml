name: Atlas validation
on:
  pull_request:
  push:
    branches: [main, GTA-maps, atlas-7-dev]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          shopt -s nullglob
          for f in ./*.js; do node --check "$f"; done
      - name: Verify release metadata, links and included files
        run: python scripts/test_site_release_70.py
      - name: Existing Atlas structural tests
        run: |
          python scripts/test_atlas_static.py
          python scripts/test_sync_gtadb_vi.py
