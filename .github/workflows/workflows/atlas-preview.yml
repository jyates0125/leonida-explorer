name: Atlas development preview ZIP
on:
  push:
    branches: [GTA-maps, atlas-7-dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate before packaging
        shell: bash
        run: |
          shopt -s nullglob
          for f in ./*.js; do node --check "$f"; done
          python scripts/test_site_release_70.py
          python scripts/test_atlas_static.py
          python scripts/test_sync_gtadb_vi.py
      - name: Assemble static site without private files
        shell: bash
        run: |
          mkdir -p public
          tar -cf - --exclude=.git --exclude=.github --exclude=public --exclude=docs \
            --exclude='*.pyc' --exclude='private-lab' --exclude='atlas-lab-private' \
            --exclude='*.zip' . | tar -xf - -C public
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: Team-Jura-Atlas-7-Preview
          path: public/
          if-no-files-found: error
          retention-days: 14
